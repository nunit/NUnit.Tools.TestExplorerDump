name: TestExplorerDump.CI

on: [push, pull_request, workflow_dispatch]

defaults:
  run:
    shell: pwsh

jobs:
  build:
    # The tool uses Windows UI Automation and Visual Studio, so build and test on Windows.
    runs-on: windows-latest

    steps:
    - name: ⤵️ Checkout Source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0 # MinVer needs the tags

    - name: 🛠️ Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
      with:
        dotnet-version: |
          10.0.x

    - name: 🏗️ Build
      run: dotnet build --configuration Release

    - name: 🧪 Test
      run: dotnet test --configuration Release --no-build

    - name: 📦 Pack
      run: dotnet pack TestExplorerDump --configuration Release --no-build

    - name: 💾 Upload package
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: Package
        path: nupkg
